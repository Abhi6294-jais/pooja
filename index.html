<!DOCTYPE html>

    <meta
      name="description"
      content="Book verified Pandit Ji for Satyanarayan Katha, Griha Pravesh, Sunderkand Path, Havan and 15+ Hindu religious ceremonies online. Experienced Vedic Pandits."

    <meta
      name="keywords"
      content="pooja booking, book pandit online, pandit ji, satyanarayan katha, griha pravesh, sunderkand path, havan, vedic rituals"
    />
    <meta property="og:title" content="Maa Bhawani Enterprises — Divine Worship Made Easy" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🙏</text></svg>" />

  <body>
    <!-- ── Floating Particles Background ── -->
    <div class="particles" id="particles"></div>

    <!-- ── Navbar ── -->
    <nav class="navbar" id="navbar">
      <div class="nav-brand" onclick="navigateTo('home')">
        <div class="brand-logo-mbe">
          <span class="mbe-top">M</span>
          <span class="mbe-mid">M · B · E</span>
          <span class="mbe-bot">E</span>
        </div>
        <span class="brand-text">Maa Bhawani Enterprises</span>
      </div>

      <div class="nav-links" id="navLinks">
        <span class="nav-link active" data-page="home" id="navHome" onclick="navigateTo('home')">होम</span>
        <span class="nav-link" data-page="pooja" id="navPooja" onclick="navigateTo('pooja')">पूजा बुक करें</span>
        <span class="nav-link" data-page="about" id="navAbout" onclick="navigateTo('about')">हमारे बारे में</span>

          <span id="langLabel">English</span>
        </button>
        <button class="cart-btn" onclick="navigateTo('cart')">

          <span class="cart-badge hidden" id="cartBadge">0</span>
        </button>
      </div>

      <button class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
        <span></span>

        <span></span>
      </button>

    <main id="app"></main>

    <!-- ── Footer ── -->
    <footer class="footer" id="footer"></footer>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">

          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
      </div>
    </div>

    <!-- ── Toast ── -->
    <div class="toast" id="toast">
      <span class="toast-icon" id="toastIcon">✅</span>
